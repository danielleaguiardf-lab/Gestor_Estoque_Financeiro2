<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gestão de estoque, inventário e custo do estoque para pequena loja de produtos de limpeza, sincronizada com o Google Planilhas.">
<meta name="theme-color" content="#0B6E69">
<title>Estoque da Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F5F4;--surface:#FFFFFF;--surface2:#E8EEEC;--ink:#12302B;--muted:#5B706B;--line:#D5DFDC;
  --accent:#0B6E69;--accent-ink:#FFFFFF;--accent-soft:#D4ECE9;
  --ok:#1F7F46;--ok-soft:#DDF3E4;--warn:#9A6512;--warn-soft:#FBF0D9;--bad:#B82E25;--bad-soft:#F9DEDB;
  --in:#1c5cab;--out:#B84C14;--in-soft:#E1ECFA;--out-soft:#FCE5D8;
  --shadow:0 1px 2px rgba(18,48,43,.06),0 8px 28px rgba(18,48,43,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E1917;--surface:#15221F;--surface2:#1C2C28;--ink:#E4EEEB;--muted:#93A8A3;--line:#2A3C38;
  --accent:#3FB8AE;--accent-ink:#06201D;--accent-soft:#16403C;
  --ok:#4CC27E;--ok-soft:#173826;--warn:#E3B04B;--warn-soft:#3A2E14;--bad:#F0736A;--bad-soft:#43201D;--in:#6da7ec;--out:#EE8A52;--in-soft:#16304F;--out-soft:#3D2416;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E1917;--surface:#15221F;--surface2:#1C2C28;--ink:#E4EEEB;--muted:#93A8A3;--line:#2A3C38;
  --accent:#3FB8AE;--accent-ink:#06201D;--accent-soft:#16403C;
  --ok:#4CC27E;--ok-soft:#173826;--warn:#E3B04B;--warn-soft:#3A2E14;--bad:#F0736A;--bad-soft:#43201D;--in:#6da7ec;--out:#EE8A52;--in-soft:#16304F;--out-soft:#3D2416;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:17px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--ink)}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.nav .bdg{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 12px}
main{padding-block:24px 60px;padding-inline:28px;min-width:0;max-width:1240px;width:100%}
.topm{display:none}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 12px;text-wrap:balance}
h3{font-size:15px;margin:0 0 8px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.hd p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.sec{margin-top:26px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;text-align:left;transition:transform .12s ease,border-color .12s}
.act:hover{border-color:var(--accent);transform:translateY(-1px)}
.act .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:800}
.act b{font-size:15px}.act span{font-size:12.5px;color:var(--muted)}
.ic.in{background:var(--in-soft);color:var(--in)}.ic.out{background:var(--out-soft);color:var(--out)}.ic.inv{background:var(--accent-soft);color:var(--accent)}.ic.new{background:var(--surface2);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.kpi.hero .l,.kpi.hero .s{color:var(--accent-ink);opacity:.85}
.kpi.bad{border-color:var(--bad);background:var(--bad-soft)}.kpi.bad .v{color:var(--bad)}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)}.kpi.warn .v{color:var(--warn)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;width:100%}
select.sm,input.sm{width:auto;padding:7px 10px;font-size:14px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chipb.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .12s}
.pc:hover{border-color:var(--accent)}
.pc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pc .nm{font-weight:700;line-height:1.25}
.pc .sub{font-size:12.5px;color:var(--muted)}
.pc .qty{display:flex;align-items:baseline;gap:6px}
.pc .qty b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.pc .qty span{color:var(--muted);font-size:13px}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.meter.baixo i{background:var(--warn)}.meter.crit i,.meter.esg i{background:var(--bad)}
.pc .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.pm{display:flex;gap:6px}
.pm button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.pm .p{color:var(--in)}.pm .m{color:var(--out)}
.pm button:hover{border-color:currentColor}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-mute{background:var(--surface2);color:var(--muted)}
.c-in{background:var(--in-soft);color:var(--in)}.c-out{background:var(--out-soft);color:var(--out)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
th.sort{cursor:pointer}th.sort:hover{color:var(--accent)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
tr.undone td{opacity:.5}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list b{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:3px}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:12px;max-width:80ch}
.banner{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.banner p{margin:0;max-width:70ch}
.abc{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:800;font-size:12px;background:var(--surface2)}
.abc.A{background:var(--accent);color:var(--accent-ink)}
.count-in{width:90px;text-align:right;padding:7px 9px}
tr.diff td{background:var(--warn-soft)}
tr.okc td{background:var(--ok-soft)}
.invbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-top:14px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.invbar b{font-variant-numeric:tabular-nums}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,25,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto;z-index:50}
.md{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:640px;padding:20px}
.md.sm{max-width:440px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.mh h2{margin:0}
.x{border:0;background:var(--surface2);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.fld small{font-weight:400;color:var(--muted)}
.fld.wide{grid-column:1/-1}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 80px 110px 36px;gap:8px;align-items:center}
.item.noprice{grid-template-columns:minmax(0,1fr) 80px 36px}
.summ{display:flex;flex-wrap:wrap;gap:6px 20px;background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px}
.summ b{font-variant-numeric:tabular-nums}
.mf{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px}
.mf .msg{flex:1 1 200px;font-size:13px;color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding-inline:16px;padding-block:12px 100px}
  .topm{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:sticky;top:0;z-index:20;background:var(--bg);padding-block:8px}
  .topm .brand{padding:0}
  .topm .gear{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
  .topm .gear svg{width:20px;height:20px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer;position:relative}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent)}
  .tabbar .bdg{position:absolute;top:0;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
  h1{font-size:25px}
  .actions{grid-template-columns:repeat(2,1fr)}
  .cols2{grid-template-columns:1fr}
  .item{grid-template-columns:1fr 1fr 36px}.item select{grid-column:1/-1}.item.noprice{grid-template-columns:1fr 36px}
  .hd .btn.desk{display:none}
}
:root{--s1:#2a78d6;--s2:#eb6834;--grid:#e1e0d9;--axis:#c3c2b7;--st-good:#0ca30c;--st-warn:#fab219;--st-serious:#ec835a;--st-crit:#d03b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--grid:#2a3c38;--axis:#3a4e49}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--grid:#2a3c38;--axis:#3a4e49}
.dash-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.dash-f .chipb{padding:8px 14px}
.qbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.qbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
.qbtn .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:800}
.qbtn:hover{border-color:var(--accent)}
.qbtn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qbtn.pri .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.dhero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:16px;margin-bottom:16px}
.herofig{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.herofig .l{font-size:13px;color:var(--muted);font-weight:600}
.herofig .v{font-family:var(--body);font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.herofig .d{font-size:13px;color:var(--muted)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:22px;font-weight:700}
.tile .s{font-size:12px;color:var(--muted)}
.tile.warn{border-color:var(--warn);background:var(--warn-soft)}.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.tile .go{font-size:12px;font-weight:700;color:var(--accent);margin-top:2px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;min-width:0}
.card.span2{grid-column:1/-1}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.ch h2{margin:0;font-size:17px}.ch p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.chart text.lbl{fill:var(--ink);font-weight:700;font-size:12px;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.35;white-space:nowrap;box-shadow:var(--shadow);z-index:5;transform:translate(-50%,-100%);margin-top:-10px}
.tip b{font-variant-numeric:tabular-nums}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.hb{display:flex;flex-direction:column;gap:4px}
.hbr{display:grid;grid-template-columns:minmax(90px,38%) 1fr;gap:10px;align-items:center;border:0;background:none;padding:6px 6px;border-radius:8px;cursor:pointer;text-align:left;width:100%}
.hbr:hover,.hbr.on{background:var(--surface2)}
.hbr .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr .tr{display:flex;align-items:center;gap:8px;min-width:0}
.hbr .bar{height:14px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px;flex:none;transition:width .3s ease}
.hbr .val{font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.hb.dim .hbr:not(.on) .bar{opacity:.35}
.seg28{display:flex;gap:2px;height:28px;margin:6px 0 10px}
.seg28 button{border:0;border-radius:4px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;padding:0 8px;text-align:left;min-width:0;overflow:visible;white-space:nowrap}
.seg28 button.dk{color:#0b0b0b}
.seg28 button:hover{filter:brightness(1.08)}
.lg2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.lg2 button{border:0;background:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;color:var(--ink);font-weight:600}
.lg2 i{width:10px;height:10px;border-radius:3px}
details.tv{margin-top:6px}details.tv summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}

<script>
(function(){
'use strict';
// ============ helpers ============
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=n=>fmtBRL.format(Math.abs(n)<0.005?0:(n||0));
const num=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2}).format(n||0);
const pct=n=>isFinite(n)?new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n)+'%':'—';
const r2=n=>Math.round((+n||0)*100)/100;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>s?s.split('-').reverse().join('/'):'—';
const curM=()=>today().slice(0,7);
const prevM=m=>{let y=+m.slice(0,4),mo=+m.slice(5,7)-1;if(!mo){mo=12;y--}return y+'-'+pad(mo)};
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mLabel=m=>MES[+m.slice(5,7)-1]+' de '+m.slice(0,4);
const mShort=m=>MES[+m.slice(5,7)-1].slice(0,3)+'/'+m.slice(2,4);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const low=s=>String(s||'').toLowerCase();
const norm=s=>low(s).normalize('NFD').replace(/[̀-ͯ]/g,'');

const CAT_PROD=['Sabão em pó','Sabão líquido','Amaciante','Desinfetante','Detergente','Água sanitária','Perfumaria','Outros'];
const UNIDADES=['Unidade','Pacote','Frasco','Galão','Caixa','Fardo','Litro','Kg'];
const ENTRADAS=[['Compra','Compra do fornecedor'],['Devolução','Cliente devolveu'],['Bonificação','Brinde / sem custo'],['Ajuste','Correção (+)']];
const SAIDAS=[['Venda','Venda'],['Uso interno','Uso na loja'],['Perda','Perda / avaria'],['Devolução ao fornecedor','Devolvido ao fornecedor'],['Ajuste','Correção (−)']];

// ============ armazenamento (mesma estrutura e chaves da versão anterior) ============
const COLS_B=['vendas','compras','despesas','investimentos','movimentos','caixa','inventarios'];
const COLS_M=['produtos','clientes','config','centros','fechamentos'];
const B={};COLS_B.forEach(c=>B[c]=new Map());
const M={};COLS_M.forEach(c=>M[c]=new Map());
const LSK='lojaLimpeza.v1.';
let ver=0;const memo={};const touched=new Set();
function all(col){
  if(memo[col]&&memo[col].ver===ver)return memo[col].arr;
  const arr=[];
  if(COLS_B.includes(col))B[col].forEach(doc=>Object.values(doc.v||{}).forEach(e=>arr.push(e)));
  else M[col].forEach((d,id)=>arr.push(Object.assign({id},d)));
  memo[col]={ver,arr};return arr;
}
function findBucket(col,id){for(const [b,doc] of B[col]){if(doc.v&&doc.v[id])return b}return null}
function getEntry(col,id){const b=findBucket(col,id);return b?B[col].get(b).v[id]:null}
function putEntry(col,e){
  e=JSON.parse(JSON.stringify(e));const b=e.data.slice(0,7);const old=findBucket(col,e.id);
  if(old&&old!==b)delete B[col].get(old).v[e.id];
  if(!B[col].has(b))B[col].set(b,{v:{}});
  B[col].get(b).v[e.id]=e;touched.add(col+'|'+e.id);ver++;
}
function delEntry(col,id){const b=findBucket(col,id);if(!b)return;delete B[col].get(b).v[id];touched.add(col+'|'+id);ver++}
function putMaster(col,id,data){const d=JSON.parse(JSON.stringify(data));delete d.id;M[col].set(id,d);touched.add(col+'|'+id);ver++}
function delMaster(col,id){M[col].delete(id);touched.add(col+'|'+id);ver++}
function saveAllLocal(){[...COLS_B,...COLS_M].forEach(col=>{try{localStorage.setItem(LSK+col,JSON.stringify(Object.fromEntries(COLS_B.includes(col)?B[col]:M[col])))}catch(e){}})}
function loadLocal(){[...COLS_B,...COLS_M].forEach(col=>{try{const raw=localStorage.getItem(LSK+col);if(raw){const t=COLS_B.includes(col)?B:M;t[col]=new Map(Object.entries(JSON.parse(raw)))}}catch(e){}});ver++}
async function commit(){saveAllLocal();gsQueueTouched();touched.clear();if(gs)gsSend();setSync()}
function cfg(){return Object.assign({nome:'Minha Loja',margemMin:20,cobertura:30,minPadrao:5,diasAviso:3},M.config.get('geral')||{})}

// ============ Google Planilhas (mesmas abas e colunas) ============
const GS_KEY=LSK+'planilha',GS_Q=LSK+'fila';
let gs=null;try{gs=JSON.parse(localStorage.getItem(GS_KEY)||'null')}catch(e){}
let gsQueue=[];try{gsQueue=JSON.parse(localStorage.getItem(GS_Q)||'[]')}catch(e){}
const gsState={sending:false,pulling:false,last:null,erro:'',versao:null,aguardando:false};
const saveQueue=()=>{try{localStorage.setItem(GS_Q,JSON.stringify(gsQueue))}catch(e){}};
const saveGs=()=>{try{gs?localStorage.setItem(GS_KEY,JSON.stringify(gs)):localStorage.removeItem(GS_KEY)}catch(e){}};
const T=(n,t,f)=>f?[n,t||'text',f]:[n,t||'text'];
const SCHEMA={
  Produtos:[T('id'),T('codigo'),T('nome'),T('categoria'),T('marca'),T('tamanho'),T('unidade'),T('estoque_inicial','int'),T('estoque_minimo','int'),T('custo','money'),T('preco','money'),T('fornecedor'),T('criado_em','date'),T('exemplo','bool'),
    T('estoque_atual','int','={estoque_inicial}+SUMIF({Movimentacoes.produto_id},{id},{Movimentacoes.quantidade})'),
    T('margem_rs','money','={preco}-{custo}'),T('margem_pct','pct','=IF({preco}>0,({preco}-{custo})/{preco},0)'),
    T('status_estoque','calc','=IF({estoque_atual}<=0,"🔴 Esgotado",IF({estoque_atual}<={estoque_minimo}/2,"🔴 Crítico",IF({estoque_atual}<={estoque_minimo},"🟡 Baixo","🟢 Normal")))')],
  Clientes:[T('id'),T('nome'),T('telefone'),T('bairro'),T('observacoes'),T('criado_em','date'),T('exemplo','bool'),
    T('qtd_compras','int','=COUNTIFS({Vendas.cliente_id},{id},{Vendas.cancelada},FALSE)'),
    T('total_comprado','money','=SUMIFS({Vendas.total},{Vendas.cliente_id},{id},{Vendas.cancelada},FALSE)'),
    T('total_pendente','money','=SUMIFS({Vendas.valor_aberto},{Vendas.cliente_id},{id})')],
  Vendas:[T('id'),T('numero','int'),T('data','date'),T('cliente_id'),T('cliente_nome'),T('produtos'),T('desconto','money'),T('total','money'),T('custo_total','money'),T('forma_pagamento'),T('data_prevista','date'),T('observacoes'),T('cancelada','bool'),T('cancelada_em','date'),T('criado_ts','int'),T('exemplo','bool'),
    T('lucro_bruto','money','=IF({cancelada},0,{total}-{custo_total})'),
    T('valor_pago','money','=SUMIF({Pagamentos.venda_id},{id},{Pagamentos.valor})'),
    T('valor_aberto','money','=IF({cancelada},0,MAX(0,ROUND({total}-{valor_pago},2)))'),
    T('situacao','calc','=IF({cancelada},"Cancelada",IF({valor_aberto}<=0,"Pago",IF(AND({data_prevista}<>"",{data_prevista}<TODAY()),"Vencido",IF({data_prevista}=TODAY(),"Vence hoje","Pendente"))))')],
  Itens_Venda:[T('id'),T('venda_id'),T('numero_venda','int'),T('data','date'),T('produto_id'),T('produto_nome'),T('quantidade','int'),T('preco_unit','money'),T('custo_unit','money'),T('subtotal','money','={quantidade}*{preco_unit}')],
  Pagamentos:[T('id'),T('venda_id'),T('numero_venda','int'),T('cliente_nome'),T('data','date'),T('valor','money'),T('forma')],
  Compras:[T('id'),T('data','date'),T('fornecedor'),T('produto_id'),T('produto_nome'),T('quantidade','int'),T('valor_unit','money'),T('total','money'),T('forma_pagamento'),T('data_pagamento','date'),T('observacoes'),T('cancelada','bool'),T('criado_ts','int'),T('exemplo','bool')],
  Despesas:[T('id'),T('data','date'),T('categoria'),T('descricao'),T('valor','money'),T('forma_pagamento'),T('pago','bool'),T('vencimento','date'),T('data_pagamento','date'),T('observacoes'),T('criado_ts','int'),T('exemplo','bool')],
  Investimentos:[T('id'),T('data','date'),T('tipo'),T('descricao'),T('valor','money'),T('forma_pagamento'),T('observacoes'),T('criado_ts','int'),T('exemplo','bool')],
  Movimentacoes:[T('id'),T('data','date'),T('produto_id'),T('produto_nome'),T('tipo'),T('quantidade','int'),T('saldo_anterior','int'),T('saldo_posterior','int'),T('motivo'),T('referencia'),T('custo_unit','money'),T('criado_ts','int'),T('exemplo','bool'),T('centro_custo_id'),T('centro_custo')],
  Caixa:[T('id'),T('data','date'),T('tipo'),T('descricao'),T('valor','money'),T('criado_ts','int'),T('categoria'),T('forma')],
  Fechamentos:[T('id'),T('mes'),T('receita_revenda','money'),T('revenda_com_nf','money'),T('revenda_sem_nf','money'),T('receita_servicos','money'),T('receita_total','money'),T('das_pago','bool'),T('relatorio_ok','bool'),T('notas_ok','bool'),T('caixa_conferido','bool'),T('saldo_sistema','money'),T('saldo_real','money'),T('lucro_liquido','money'),T('observacoes'),T('fechado_em','date')],
  Config:[T('chave'),T('valor')],
  Centros_Custo:[T('id'),T('codigo'),T('nome'),T('descricao'),T('ativo','bool'),T('criado_em','date'),T('exemplo','bool')],
  Inventarios:[T('id'),T('data','date'),T('itens_contados','int'),T('itens_com_diferenca','int'),T('diferenca_unidades','int'),T('diferenca_valor','money'),T('valor_contado','money'),T('observacoes'),T('criado_ts','int')],
  Itens_Inventario:[T('id'),T('inventario_id'),T('data','date'),T('produto_id'),T('produto_nome'),T('qtd_sistema','int'),T('qtd_contada','int'),T('custo_unit','money'),
    T('diferenca','int','={qtd_contada}-{qtd_sistema}'),T('diferenca_valor','money','=({qtd_contada}-{qtd_sistema})*{custo_unit}')],
};
const TAB={fechamentos:'Fechamentos',produtos:'Produtos',clientes:'Clientes',vendas:'Vendas',compras:'Compras',despesas:'Despesas',investimentos:'Investimentos',movimentos:'Movimentacoes',caixa:'Caixa',inventarios:'Inventarios',centros:'Centros_Custo'};
const ccName=id=>id?(M.centros.get(id)?.nome||'(centro removido)'):'';
const centros=()=>all('centros').slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
const ccOk=(m,cc)=>!cc||(cc==='__sem'?!m.cc:m.cc===cc);
const pNome=id=>{const p=M.produtos.get(id);return p?[p.nome,p.tamanho].filter(Boolean).join(' '):''};
const cNome=s=>s.clienteId?(M.clientes.get(s.clienteId)?.nome||''):(s.clienteNome||'Venda avulsa');
function toRow(col,e){const ex=!!e.exemplo;switch(col){
  case 'produtos':return{id:e.id,codigo:e.codigo,nome:e.nome,categoria:e.categoria,marca:e.marca,tamanho:e.tamanho,unidade:e.unidade,estoque_inicial:e.estoqueInicial,estoque_minimo:e.estoqueMinimo,custo:e.custo,preco:e.preco,fornecedor:e.fornecedor,criado_em:e.criadoEm,exemplo:ex};
  case 'clientes':return{id:e.id,nome:e.nome,telefone:e.telefone,bairro:e.bairro,observacoes:e.obs,criado_em:e.criadoEm,exemplo:ex};
  case 'vendas':return{id:e.id,numero:e.numero,data:e.data,cliente_id:e.clienteId,cliente_nome:cNome(e),produtos:(e.itens||[]).map(i=>pNome(i.produtoId)+' x'+i.qtd).join('; '),desconto:e.desconto||0,total:e.total,custo_total:e.custoTotal,forma_pagamento:e.forma,data_prevista:e.prevista,observacoes:e.obs,cancelada:!!e.cancelada,cancelada_em:e.canceladaEm||'',criado_ts:e.ts,exemplo:ex};
  case 'compras':return{id:e.id,data:e.data,fornecedor:e.fornecedor,produto_id:e.produtoId,produto_nome:pNome(e.produtoId),quantidade:e.qtd,valor_unit:e.valorUnit,total:e.total,forma_pagamento:e.forma,data_pagamento:e.dataPagamento,observacoes:e.obs,cancelada:!!e.cancelada,criado_ts:e.ts,exemplo:ex};
  case 'despesas':return{id:e.id,data:e.data,categoria:e.categoria,descricao:e.descricao,valor:e.valor,forma_pagamento:e.forma,pago:!!e.pago,vencimento:e.vencimento,data_pagamento:e.dataPagamento,observacoes:e.obs,criado_ts:e.ts,exemplo:ex};
  case 'investimentos':return{id:e.id,data:e.data,tipo:e.tipo,descricao:e.descricao,valor:e.valor,forma_pagamento:e.forma,observacoes:e.obs,criado_ts:e.ts,exemplo:ex};
  case 'movimentos':return{id:e.id,data:e.data,produto_id:e.produtoId,produto_nome:pNome(e.produtoId),tipo:e.tipo,quantidade:e.qtd,saldo_anterior:e.saldoAnterior,saldo_posterior:e.saldoPosterior,motivo:e.motivo,referencia:e.ref||'',custo_unit:e.custoUnit??'',criado_ts:e.ts,exemplo:ex,centro_custo_id:e.cc||'',centro_custo:ccName(e.cc)};
  case 'centros':return{id:e.id,codigo:e.codigo,nome:e.nome,descricao:e.descricao,ativo:e.ativo!==false,criado_em:e.criadoEm,exemplo:ex};
  case 'caixa':return{id:e.id,data:e.data,tipo:e.tipo,descricao:e.descricao,valor:e.valor,criado_ts:e.ts,categoria:e.categoria||'',forma:e.forma||''};
  case 'fechamentos':return{id:e.id,mes:e.id,receita_revenda:e.revenda,revenda_com_nf:e.comNF,revenda_sem_nf:r2((e.revenda||0)-(e.comNF||0)),receita_servicos:e.servicos,receita_total:e.total,das_pago:!!e.dasPago,relatorio_ok:!!e.relatorioOk,notas_ok:!!e.notasOk,caixa_conferido:!!e.caixaOk,saldo_sistema:e.saldoSistema,saldo_real:e.saldoReal??'',lucro_liquido:e.lucro,observacoes:e.obs,fechado_em:e.fechadoEm};
  case 'inventarios':return{id:e.id,data:e.data,itens_contados:(e.itens||[]).length,itens_com_diferenca:(e.itens||[]).filter(i=>i.contado!==i.sistema).length,diferenca_unidades:sum(e.itens||[],i=>i.contado-i.sistema),diferenca_valor:r2(sum(e.itens||[],i=>(i.contado-i.sistema)*i.custo)),valor_contado:r2(sum(e.itens||[],i=>i.contado*i.custo)),observacoes:e.obs,criado_ts:e.ts};
}}
const itemRows=s=>(s.itens||[]).map((i,k)=>({id:s.id+'-i'+k,venda_id:s.id,numero_venda:s.numero,data:s.data,produto_id:i.produtoId,produto_nome:pNome(i.produtoId),quantidade:i.qtd,preco_unit:i.preco,custo_unit:i.custo}));
const payRows=s=>(s.pagamentos||[]).map((p,k)=>({id:s.id+'-p'+k,venda_id:s.id,numero_venda:s.numero,cliente_nome:cNome(s),data:p.data,valor:p.valor,forma:p.forma}));
const invRows=v=>(v.itens||[]).map((i,k)=>({id:v.id+'-c'+k,inventario_id:v.id,data:v.data,produto_id:i.produtoId,produto_nome:pNome(i.produtoId),qtd_sistema:i.sistema,qtd_contada:i.contado,custo_unit:i.custo}));
const cfgRows=()=>Object.entries(M.config.get('geral')||{}).map(([k,v])=>({chave:k,valor:String(v??'')}));
function opsFor(key){
  const [col,id]=key.split('|');
  if(col==='config')return cfgRows().map(r=>({op:'upsert',tab:'Config',id:r.chave,row:r}));
  if(COLS_M.includes(col)){const d=M[col].get(id);return[d?{op:'upsert',tab:TAB[col],id,row:toRow(col,Object.assign({id},d))}:{op:'delete',tab:TAB[col],id}]}
  const e=getEntry(col,id);const main=e?{op:'upsert',tab:TAB[col],id,row:toRow(col,e)}:{op:'delete',tab:TAB[col],id};
  if(col==='vendas')return[main,{op:'replaceWhere',tab:'Itens_Venda',col:'venda_id',val:id,rows:e?itemRows(e):[]},{op:'replaceWhere',tab:'Pagamentos',col:'venda_id',val:id,rows:e?payRows(e):[]}];
  if(col==='inventarios')return[main,{op:'replaceWhere',tab:'Itens_Inventario',col:'inventario_id',val:id,rows:e?invRows(e):[]}];
  return[main];
}
function fullOps(){
  const ops=[];
  COLS_M.filter(c=>c!=='config').forEach(c=>ops.push({op:'replaceAll',tab:TAB[c],rows:all(c).map(e=>toRow(c,e))}));
  COLS_B.forEach(c=>ops.push({op:'replaceAll',tab:TAB[c],rows:all(c).map(e=>toRow(c,e))}));
  ops.push({op:'replaceAll',tab:'Itens_Venda',rows:[].concat(...all('vendas').map(itemRows))});
  ops.push({op:'replaceAll',tab:'Pagamentos',rows:[].concat(...all('vendas').map(payRows))});
  ops.push({op:'replaceAll',tab:'Itens_Inventario',rows:[].concat(...all('inventarios').map(invRows))});
  ops.push({op:'replaceAll',tab:'Config',rows:cfgRows()});
  return ops;
}
const gsUrl=extra=>gs.url+(gs.url.includes('?')?'&':'?')+extra+'&chave='+encodeURIComponent(gs.chave)+'&t='+Date.now();
async function gsPost(body){
  const res=await fetch(gs.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({chave:gs.chave,schema:SCHEMA},body))});
  let j;try{j=await res.json()}catch(e){throw new Error('A planilha não respondeu direito. Confira o endereço.')}
  if(!j.ok)throw new Error(j.erro||'Erro na planilha.');return j;
}
async function gsGet(){
  const res=await fetch(gsUrl('modo=tudo'));let j;try{j=await res.json()}catch(e){throw new Error('A planilha não respondeu direito. Confira o endereço.')}
  if(!j.ok)throw new Error(j.erro||'Erro na planilha.');if(j.versao)gsState.versao=j.versao;if(j.planilha&&gs.planilha!==j.planilha){gs.planilha=j.planilha;saveGs()}return j.dados||{};
}
function gsQueueTouched(){if(!gs||!touched.size)return;touched.forEach(k=>gsQueue.push(...opsFor(k)));saveQueue()}
async function gsSend(){
  if(!gs||gsState.sending||!gsQueue.length)return;gsState.sending=true;setSync();

async function gsSync(silent){

  gsState.pulling=true;setSync();
  try{const d=await gsGet();if(!gsQueue.length&&!touched.size){applySheets(fromSheets(d));gsState.erro='';gsState.last=new Date();render();if(!silent)toast('Dados atualizados da planilha.')}}

async function gsCheck(){
  if(!gs||gsState.pulling||gsState.sending||document.visibilityState!=='visible')return;
  if(gsQueue.length){gsSend();return}
  try{const res=await fetch(gsUrl('modo=versao'));const j=await res.json();if(!j.ok)throw new Error(j.erro||'Erro');
    if(gsState.erro){gsState.erro='';setSync()}
    if(j.versao!==gsState.versao){if($('#ov')){gsState.aguardando=true;return}gsSync(true)}}
  catch(e){gsState.erro='Sem conexão com a planilha';setSync()}
}

function stockInfo(){
  if(memo.stock&&memo.stock.ver===ver)return memo.stock.v;
  const v={};all('produtos').forEach(p=>v[p.id]={ent:0,sai:0,atual:+p.estoqueInicial||0});
  all('movimentos').forEach(m=>{const s=v[m.produtoId];if(!s)return;if(m.qtd>0)s.ent+=m.qtd;else s.sai+=-m.qtd;s.atual+=m.qtd});
  memo.stock={ver,v};return v;
}
const stock=id=>(stockInfo()[id]||{atual:0}).atual;
function status(p){const a=stock(p.id),mn=+p.estoqueMinimo||0;
  if(a<=0)return{k:'esg',label:'Sem estoque',cls:'c-bad',ic:'⛔'};
  if(mn>0&&a<=mn/2)return{k:'crit',label:'Crítico',cls:'c-bad',ic:'🔴'};
  if(a<=mn)return{k:'baixo',label:'Baixo',cls:'c-warn',ic:'🟡'};
  return{k:'ok',label:'Normal',cls:'c-ok',ic:'🟢'}}
const margemP=p=>(+p.preco)>0?((+p.preco-(+p.custo||0))/(+p.preco))*100:0;
const valorEst=p=>Math.max(0,stock(p.id))*(+p.custo||0);
function lastCompra(pid){let c=null;all('compras').forEach(x=>{if(x.produtoId===pid&&!x.cancelada&&(!c||x.data>c.data||(x.data===c.data&&(x.ts||0)>(c.ts||0))))c=x});return c}
function undoneSet(){
  if(memo.undone&&memo.undone.ver===ver)return memo.undone.v;const v=new Set();
  const vc=new Set(all('vendas').filter(s=>s.cancelada).map(s=>s.id)),cc=new Set(all('compras').filter(c=>c.cancelada).map(c=>c.id));
  const est=new Set(all('movimentos').filter(m=>m.tipo==='Estorno').map(m=>m.ref));
  all('movimentos').forEach(m=>{if(m.tipo==='Estorno'||m.tipo==='Inventário')return;if((m.tipo==='Venda'&&vc.has(m.ref))||(m.tipo==='Compra'&&cc.has(m.ref))||est.has(m.id))v.add(m.id)});
  memo.undone={ver,v};return v;

const undone=m=>undoneSet().has(m.id);
const isOut=t=>['Venda','Uso interno','Perda','Devolução ao fornecedor'].includes(t);
// custo das saídas (CMV + perdas + uso) num intervalo
function saidas(a,b){
  const r={vendaQ:0,cmv:0,fat:0,perdaQ:0,perda:0,usoQ:0,uso:0,outQ:0};
  all('vendas').forEach(s=>{if(s.cancelada||s.data<a||s.data>b)return;r.fat+=+s.total||0;r.cmv+=+s.custoTotal||0;r.vendaQ+=sum(s.itens||[],i=>i.qtd)});
  all('movimentos').forEach(m=>{if(m.data<a||m.data>b||undone(m))return;const c=-m.qtd*(m.custoUnit??(+prod(m.produtoId)?.custo||0));
    if(m.tipo==='Perda'){r.perdaQ+=-m.qtd;r.perda+=c}else if(m.tipo==='Uso interno'){r.usoQ+=-m.qtd;r.uso+=c}if(m.qtd<0)r.outQ+=-m.qtd});
  return r;
}
function entradas(a,b){
  const r={q:0,valor:0,compras:0};
  all('compras').forEach(c=>{if(c.cancelada||c.data<a||c.data>b)return;r.compras+=+c.total||0});
  all('movimentos').forEach(m=>{if(m.data<a||m.data>b||m.qtd<=0||m.tipo==='Estorno'||undone(m))return;r.q+=m.qtd});
  r.valor=r.compras;return r;
}
const monthRange=m=>[m+'-01',m+'-31'];
function vendidoPor(a,b){const r={};all('vendas').forEach(s=>{if(s.cancelada||s.data<a||s.data>b)return;(s.itens||[]).forEach(i=>r[i.produtoId]=(r[i.produtoId]||0)+i.qtd)});return r}
function reposicao(){
  const t=today(),c=cfg(),q30=vendidoPor(addDays(t,-29),t),q90=vendidoPor(addDays(t,-89),t);
  return prods().map(p=>{const at=stock(p.id),mn=+p.estoqueMinimo||0,v30=q30[p.id]||0,med=(q90[p.id]||0)/3,dia=med/30;
    let sug=Math.max(0,Math.ceil(dia*(+c.cobertura||30)+mn-at));if(med===0&&at<=mn)sug=Math.max(0,Math.max(mn,1)*2-at);
    const cob=dia>0?Math.floor(Math.max(0,at)/dia):null;
    return{p,at,mn,v30,med,dia,cob,sug,custoSug:sug*(+p.custo||0)}});
}
function abc(){
  const list=prods().map(p=>({p,v:valorEst(p)})).sort((a,b)=>b.v-a.v);const tot=sum(list,x=>x.v)||1;let acc=0;const r={};
  list.forEach(x=>{acc+=x.v;const share=acc/tot;r[x.p.id]={cls:x.v<=0?'—':share<=0.8||acc-x.v===0?'A':share<=0.95?'B':'C',share:x.v/tot}});return r;
}

function opEntrada({data,tipo,itens,fornecedor,obs,cc}){cc=cc||undefined;
  itens.forEach(it=>{const p=prod(it.produtoId),before=stock(p.id);
    let cu=+p.custo||0;
    if(tipo==='Compra'){cu=+it.custo;const id=uid();putEntry('compras',{id,ts:Date.now(),data,fornecedor,produtoId:p.id,qtd:it.qtd,valorUnit:cu,total:r2(it.qtd*cu),forma:'',dataPagamento:data,obs});

      const np=Object.assign({},M.produtos.get(p.id),{custo:Math.round(nc*100)/100});if(fornecedor&&tipo==='Compra')np.fornecedor=fornecedor;putMaster('produtos',p.id,np)}

function nextSaleNo(){return all('vendas').reduce((m,s)=>Math.max(m,+s.numero||0),0)+1}
function opSaida({data,tipo,itens,cliente,clienteId,obs,cc,pay}){cc=cc||undefined;pay=pay||{modo:'agora',forma:'Não informado'};
  if(tipo==='Venda'){const id=uid(),numero=nextSaleNo();

}

const PERIODOS=[['7','7 dias'],['30','30 dias'],['90','90 dias'],['365','12 meses']];
function perRange(per){const t=today();return[addDays(t,-(+per-1)),t]}
function buckets(per){
  const t=today(),out=[];
  if(per==='7'){for(let i=6;i>=0;i--){const d=addDays(t,-i);out.push({a:d,b:d,label:d.slice(8,10)+'/'+d.slice(5,7)})}}
  else if(per==='365'){let m=curM();const ms=[];for(let i=0;i<12;i++){ms.unshift(m);m=prevM(m)}ms.forEach(x=>out.push({a:x+'-01',b:x+'-31',label:mShort(x)}))}
  else{const n=per==='30'?5:13;for(let i=n-1;i>=0;i--){const b=addDays(t,-7*i),a=addDays(b,-6);out.push({a,b,label:a.slice(8,10)+'/'+a.slice(5,7)})}}
  return out;
}
const inCat=(pid,cat)=>!cat||(prod(pid)?.categoria||'Sem categoria')===cat;
function fluxoEstoque(a,b,cat,cc){
  const r={inQ:0,inV:0,outQ:0,outV:0,perdaV:0};
  all('movimentos').forEach(m=>{if(m.data<a||m.data>b||m.tipo==='Estorno'||undone(m)||!inCat(m.produtoId,cat)||!ccOk(m,cc))return;
    const cu=m.custoUnit??(+prod(m.produtoId)?.custo||0);if(m.qtd>0){r.inQ+=m.qtd;r.inV+=m.qtd*cu}else{r.outQ+=-m.qtd;r.outV+=-m.qtd*cu;if(m.tipo==='Perda'||m.tipo==='Uso interno')r.perdaV+=-m.qtd*cu}});
  return r;
}
function serieValor(per,cat){
  const ps=prods().filter(p=>inCat(p.id,cat));const cost={};ps.forEach(p=>cost[p.id]=+p.custo||0);
  const now=sum(ps,p=>stock(p.id)*cost[p.id]);
  const t=today(),[a]=perRange(per),step=per==='365'?7:1;
  const dates=[];for(let d=t;d>=addDays(a,-1);d=addDays(d,-step))dates.push(d);
  const ms=all('movimentos').filter(m=>cost[m.produtoId]!==undefined).sort((x,y)=>y.data.localeCompare(x.data));
  let v=now,k=0;const pts=[];
  dates.forEach(d=>{while(k<ms.length&&ms[k].data>d){v-=ms[k].qtd*cost[ms[k].produtoId];k++}pts.unshift({d,v:Math.max(0,v)})});
  return pts;
}
function vendidosTop(a,b,cat,cc){const r={};all('movimentos').forEach(m=>{if(m.tipo!=='Venda'||m.data<a||m.data>b||undone(m)||!inCat(m.produtoId,cat)||!ccOk(m,cc))return;r[m.produtoId]=(r[m.produtoId]||0)-m.qtd});
  return Object.entries(r).filter(([id])=>prod(id)).sort((x,y)=>y[1]-x[1]).slice(0,6)}
const CH={};
const brlC=v=>Math.abs(v)>=1000?'R$ '+num(Math.round(v/100)/10)+' mil':'R$ '+num(Math.round(v));
function niceAxis(v){if(v<=0)return{top:4,step:1};const step=niceMax(v/4);return{top:Math.ceil(v/step-1e-9)*step,step}}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,2,2.5,5,10])if(m*p>=v)return m*p;return 10*p}

function lineChart(el,pts){
  const W=Math.max(260,el.clientWidth),H=210,ml=58,mr=14,mt=22,mb=24,iw=W-ml-mr,ih=H-mt-mb;
  if(!pts.length){el.innerHTML='<p class="sub">Sem dados.</p>';return}
  const ax=niceAxis(Math.max(...pts.map(p=>p.v),1)),max=ax.top,n=pts.length;
  const x=i=>ml+(n<2?iw/2:i*iw/(n-1)),y=v=>mt+ih-v/max*ih;
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.v).toFixed(1)).join('');
  const area=line+`L${x(n-1).toFixed(1)},${mt+ih}L${x(0).toFixed(1)},${mt+ih}Z`;
  let g='';for(let v=0;v<=max+1e-9;v+=ax.step){const k=v,yy=y(v);g+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" stroke="var(${k?'--grid':'--axis'})" stroke-width="1"/><text x="${ml-8}" y="${yy+4}" text-anchor="end">${brlC(v)}</text>`}
  const xl=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map((i,k,a)=>`<text x="${x(i)}" y="${H-6}" text-anchor="${a.length>1&&k===0?'start':k===a.length-1&&a.length>1?'end':'middle'}">${fd(pts[i].d).slice(0,5)}</text>`).join('');
  const last=pts[n-1];
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Valor do estoque de ${fd(pts[0].d)} a ${fd(last.d)}: de ${brl(pts[0].v)} para ${brl(last.v)}">${g}
    <path d="${area}" fill="var(--accent)" fill-opacity=".10"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n-1)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <text class="lbl" x="${x(n-1)}" y="${y(last.v)-10}" text-anchor="end">${brl(last.v)}</text>${xl}
    <line class="xh" x1="0" x2="0" y1="${mt}" y2="${mt+ih}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle class="hd" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect class="hit" x="${ml}" y="0" width="${iw}" height="${H}" fill="transparent" style="cursor:crosshair"/></svg><div class="tip" hidden></div>`;
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh'),hd=el.querySelector('.hd');
  const move=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width;const i=Math.max(0,Math.min(n-1,Math.round((px-ml)/iw*(n-1))));
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');hd.setAttribute('cx',x(i));hd.setAttribute('cy',y(pts[i].v));hd.setAttribute('visibility','visible');
    tip.hidden=false;tip.innerHTML=`${fd(pts[i].d)}<br><b>${brl(pts[i].v)}</b>`;tip.style.left=Math.max(60,Math.min(r.width-60,x(i)*r.width/W))+'px';tip.style.top=(y(pts[i].v)*r.height/H)+'px'};
  const out=()=>{tip.hidden=true;xh.setAttribute('visibility','hidden');hd.setAttribute('visibility','hidden')};
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);svg.addEventListener('pointerleave',out);
}
function colPath(x0,yTop,w,base){const h=base-yTop;if(h<=0.5)return '';const r=Math.min(4,h,w/2);return `M${x0},${base}V${yTop+r}Q${x0},${yTop} ${x0+r},${yTop}H${x0+w-r}Q${x0+w},${yTop} ${x0+w},${yTop+r}V${base}Z`}
function barsChart(el,bk,modo){
  const W=Math.max(260,el.clientWidth),H=210,ml=58,mr=10,mt=14,mb=24,iw=W-ml-mr,ih=H-mt-mb,base=mt+ih;
  const A=bk.map(b=>modo==='q'?b.inQ:b.inV),Bv=bk.map(b=>modo==='q'?b.outQ:b.outV),fmt=modo==='q'?(v=>num(v)+' un.'):brl,fax=modo==='q'?(v=>num(v)):brlC;
  const ax=niceAxis(Math.max(1,...A,...Bv)),max=ax.top,n=bk.length,band=iw/n,bw=Math.max(3,Math.min(24,(band*0.72-2)/2)),gw=bw*2+2;
  const y=v=>base-v/max*ih;let g='';

function payStat(s){const t=today(),c=cfg();
  if(s.prevista&&s.prevista<t){const d=Math.round((Date.parse(t)-Date.parse(s.prevista))/864e5);return{k:'venc',label:'Vencido há '+d+' dia'+(d>1?'s':''),cls:'c-bad',ic:'🔴',dias:d}}
  if(s.prevista===t)return{k:'hoje',label:'Vence hoje',cls:'c-warn',ic:'🟠',dias:0};
  if(s.prevista){const d=Math.round((Date.parse(s.prevista)-Date.parse(t))/864e5);if(d<=(+c.diasAviso||3))return{k:'prox',label:'Vence em '+d+' dia'+(d>1?'s':''),cls:'c-warn',ic:'🟡',dias:d}}
  return{k:'pend',label:s.prevista?'Vence em '+fd(s.prevista):'Sem data',cls:'c-mute',ic:'⏳',dias:null}}
const cliKey=s=>s.clienteId?'id:'+s.clienteId:'nm:'+norm(s.clienteNome||'Venda avulsa');
function devedores(){
  const g={};all('vendas').forEach(s=>{const o=openOf(s);if(o<=0.005)return;const k=cliKey(s);
    const x=g[k]||(g[k]={k,nome:cNome(s),tel:s.clienteId?(M.clientes.get(s.clienteId)?.telefone||''):'',vendas:[],aberto:0,vencido:0,maxDias:0,prox:''});
    x.vendas.push(s);x.aberto+=o;const st=payStat(s);if(st.k==='venc'){x.vencido+=o;x.maxDias=Math.max(x.maxDias,st.dias)}if(s.prevista&&(!x.prox||s.prevista<x.prox))x.prox=s.prevista});
  return Object.values(g).map(x=>{x.vendas.sort((a,b)=>(a.prevista||a.data).localeCompare(b.prevista||b.data));x.st=x.vencido>0?'venc':x.vendas.some(s=>payStat(s).k==='hoje')?'hoje':x.vendas.some(s=>payStat(s).k==='prox')?'prox':'pend';return x})
    .sort((a,b)=>b.maxDias-a.maxDias||b.vencido-a.vencido||(a.prox||'9').localeCompare(b.prox||'9'));
}

function mPagar(key){

    <div class="fgrid">${fld('Valor recebido (R$)',`<input type="number" inputmode="decimal" id="pg-v" min="0" step="0.01" value="${g.aberto.toFixed(2)}">`)}${fld('Data',`<input type="date" id="pg-d" value="${today()}">`)}${fld('Forma',`<select id="pg-f">${FORMAS_PG.map(x=>`<option>${x}</option>`).join('')}</select>`)}</div>

    <div class="mf"><span class="msg" id="mMsg"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" id="pg-s">Confirmar</button></div>`,true);
  $('#pg-s').onclick=async()=>{let v=r2(nval('pg-v'));const d=val('pg-d'),fm=val('pg-f');if(!(v>0))return setMsg('Informe o valor recebido.');if(v>g.aberto+0.005)return setMsg('O valor é maior que o total devido ('+brl(g.aberto)+').');
    $('#pg-s').disabled=true;const tot=v;for(const s of g.vendas){if(v<=0.005)break;const x=Math.min(v,openOf(s));const y=JSON.parse(JSON.stringify(getEntry('vendas',s.id)));y.pagamentos=(y.pagamentos||[]).concat([{data:d,valor:r2(x),forma:fm}]);putEntry('vendas',y);v=r2(v-x)}

  return `<div class="sec"><div class="hd" style="margin-bottom:10px"><div><h2 style="margin:0">Por centro de custo</h2><p>Quanto custou o que saiu do estoque em cada centro. Toque numa linha para ver os lançamentos.</p></div><button class="btn" data-act="go" data-id="ajustes">Gerenciar centros</button></div>

    $('#mv-items').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.rm,1);draw()});upd()};

    const fw=$('#mv-forn-w');if(fw)fw.hidden=tipo!=='Compra';const cw=$('#mv-cli-w');if(cw)cw.hidden=tipo!=='Venda';const pw=$('#mv-pay');if(pw)pw.hidden=tipo!=='Venda';draw()});
  let payModo='agora';const pw0=$('#mv-pay');const setPay=m=>{payModo=m;pw0.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===m));$('#pay-a').hidden=m!=='agora';['pay-d1','pay-d2','pay-d3'].forEach(i=>$('#'+i).hidden=m!=='depois');$('#mv-cli').placeholder=m==='depois'?'Obrigatório no fiado':'Opcional se pago agora';if(m==='agora'&&val('mv-fp')==='__fiado')$('#mv-fp').value='Pix'};

    <div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${kpi('Em estoque',num(stock(id)),chip(s))}${kpi('Custo médio',brl(p.custo),lc?'Última compra '+brl(lc.valorUnit):'')}${kpi('Valor parado',brl(valorEst(p)))}${kpi('Saiu em 30 dias',num(v30)+' un.',+p.preco>0?'Margem '+pct(margemP(p)):'')}</div>
    <div class="mf" style="justify-content:flex-start"><button class="btn pri" data-act="entrada" data-id="${id}">+ Entrada</button><button class="btn" data-act="saida" data-id="${id}">− Saída</button><button class="btn" data-act="editProd" data-id="${id}">Editar</button></div>
    ${cs.length?`<h3 style="margin-top:18px">Últimas compras</h3><ul class="list">${cs.map(c=>`<li><span>${fd(c.data)} · ${esc(c.fornecedor||'—')}</span><b>${num(c.qtd)} × ${brl(c.valorUnit)}</b></li>`).join('')}</ul>`:''}
    <h3 style="margin-top:18px">Histórico</h3>${ms.length?`<ul class="list">${ms.slice(0,12).map(m=>`<li style="${undone(m)?'opacity:.5':''}"><span>${movChip(m)} <span class="sub">${fd(m.data)} · ${esc(m.motivo||'')}</span></span><b style="color:var(--${m.qtd>0?'in':'out'})">${m.qtd>0?'+':'−'}${num(Math.abs(m.qtd))} → ${num(m.saldoPosterior)}</b></li>`).join('')}</ul>`:`<p class="sub">Sem movimentações. Estoque inicial: ${num(p.estoqueInicial)}.</p>`}`);
}

function mInvInfo(id){const v=getEntry('inventarios',id);if(!v)return;const it=(v.itens||[]).slice().sort((a,b)=>Math.abs((b.contado-b.sistema)*b.custo)-Math.abs((a.contado-a.sistema)*a.custo));
  openModal('Contagem de '+fd(v.data),`${v.obs?`<p class="sub" style="margin-top:-6px">${esc(v.obs)}</p>`:''}${table(['Produto',['Sistema','n'],['Contado','n'],['Diferença','n'],['R$','n']],it.map(i=>{const d=i.contado-i.sistema;return `<tr class="${d?'diff':''}"><td>${esc(pName(prod(i.produtoId)))}</td><td class="n">${num(i.sistema)}</td><td class="n">${num(i.contado)}</td><td class="n">${d>0?'+':''}${num(d)}</td><td class="n">${d?brl(d*i.custo):'—'}</td></tr>`}))}
  <div class="summ"><span>Diferença total <b>${brl(sum(it,i=>(i.contado-i.sistema)*i.custo))}</b></span><span>Valor contado <b>${brl(sum(it,i=>i.contado*i.custo))}</b></span></div>`)}

async function gsConnect(){
  const url=val('gs-url'),chave=val('gs-chave'),msg=$('#gs-msg'),btn=$('#gs-go');
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){msg.textContent='Cole o endereço que termina em /exec.';return}
  if(!chave){msg.textContent='Digite a chave de acesso.';return}
  try{localStorage.setItem(LSK+'gsurl',url)}catch(e){}
  btn.disabled=true;msg.textContent='Conectando…';const prev=gs;gs={url,chave};
  try{
    await gsPost({ops:[]});const d=await gsGet();const temPlan=sheetHasData(d),temLocal=all('produtos').length||all('movimentos').length;
    const finish=async how=>{gsQueue=[];touched.clear();
      if(how==='enviar'){gsQueue=fullOps();saveQueue();saveGs();closeModal();render();await gsSend();gsState.last=new Date();render();toast(gsState.erro||'Planilha conectada.')}
      else{applySheets(fromSheets(d));saveQueue();saveGs();gsState.last=new Date();gsState.erro='';closeModal();render();toast('Planilha conectada. Dados carregados.')}};
    if(temPlan&&temLocal){openModal('A planilha já tem dados',`<p style="margin-top:0">Este aparelho também tem lançamentos. Qual versão manter?</p><div class="mf" style="justify-content:flex-start"><button class="btn pri" id="gs-a">Usar os da planilha (recomendado)</button><button class="btn" id="gs-b">Enviar os deste aparelho</button></div>`,true);
      $('#gs-a').onclick=()=>finish('carregar');$('#gs-b').onclick=()=>finish('enviar');gs=prev;const g2={url,chave};$('#gs-a').addEventListener('click',()=>{gs=g2},{capture:true});$('#gs-b').addEventListener('click',()=>{gs=g2},{capture:true})}
    else await finish(temPlan||!temLocal?'carregar':'enviar');
  }catch(e){gs=prev;btn.disabled=false;const m=String(e&&e.message||'');msg.textContent=/fetch|network|load failed/i.test(m)?'A planilha não liberou o acesso. No Apps Script: Implantar → Gerenciar implantações → Editar → "Qualquer pessoa" → Nova versão → Implantar.':m}
}

// ============ exemplo ============
function loadExample(){
  const t=today();const P=[['P001','Sabão em pó','800 g','Limpex','Sabão em pó',20,6,9.5,14.9],['P002','Sabão em pó','1,6 kg','Limpex','Sabão em pó',12,4,17.8,26.9],['P003','Sabão líquido','3 L','Brisa','Sabão líquido',10,4,21,32],['P004','Amaciante','2 L','Fofura','Amaciante',15,6,7.2,12.9],['P005','Amaciante','5 L','Fofura','Amaciante',4,3,19.5,22.9],['P006','Desinfetante','2 L','Lavanda','Desinfetante',18,6,5.4,9.9]];
  const ids=P.map(r=>{const id='ex'+r[0];putMaster('produtos',id,{codigo:r[0],nome:r[1],tamanho:r[2],marca:r[3],categoria:r[4],unidade:'Unidade',estoqueInicial:r[5],estoqueMinimo:r[6],custo:r[7],preco:r[8],fornecedor:'Distribuidora Central',exemplo:true,criadoEm:addDays(t,-40)});return id});
  const CCX=[['exCC1','Balcão','Vendas na loja'],['exCC2','Entregas','Pedidos entregues no bairro'],['exCC3','Uso da loja','Limpeza do próprio ponto']];CCX.forEach(([id,nome,descricao])=>putMaster('centros',id,{nome,codigo:'',descricao,ativo:true,criadoEm:addDays(t,-40),exemplo:true}));
  let seed=3;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
  for(let d=-38;d<=0;d+=2){const id=ids[Math.floor(rnd()*ids.length)],q=1+Math.floor(rnd()*3);if(stock(id)>=q)opSaida({data:addDays(t,d),tipo:'Venda',itens:[{produtoId:id,qtd:q,preco:prod(id).preco}],cliente:'',obs:'',cc:rnd()<0.6?'exCC1':'exCC2'});
    if(d===-20)opEntrada({data:addDays(t,d),tipo:'Compra',itens:[{produtoId:ids[0],qtd:12,custo:9.9},{produtoId:ids[3],qtd:12,custo:7.0}],fornecedor:'Distribuidora Central',obs:'NF 1520'});
    if(d===-10)opSaida({data:addDays(t,d),tipo:'Perda',itens:[{produtoId:ids[2],qtd:1}],obs:'Frasco vazou',cc:'exCC3'});
    if(d===-6)opSaida({data:addDays(t,d),tipo:'Uso interno',itens:[{produtoId:ids[5],qtd:1}],obs:'Limpeza da loja',cc:'exCC3'});}
  const c1='exCli1',c2='exCli2';putMaster('clientes',c1,{nome:'Maria Souza',telefone:'(11) 98888-1111',bairro:'Centro',obs:'',criadoEm:addDays(t,-30),exemplo:true});putMaster('clientes',c2,{nome:'João Pereira',telefone:'(11) 97777-2222',bairro:'Vila Nova',obs:'',criadoEm:addDays(t,-30),exemplo:true});
  if(stock(ids[1])>=1)opSaida({data:addDays(t,-12),tipo:'Venda',itens:[{produtoId:ids[1],qtd:1,preco:prod(ids[1]).preco}],cliente:'Maria Souza',clienteId:c1,obs:'',cc:'exCC2',pay:{modo:'depois',vence:addDays(t,-5),entrada:0}});
  if(stock(ids[3])>=2)opSaida({data:addDays(t,-3),tipo:'Venda',itens:[{produtoId:ids[3],qtd:2,preco:prod(ids[3]).preco}],cliente:'João Pereira',clienteId:c2,obs:'',cc:'exCC1',pay:{modo:'depois',vence:addDays(t,2),entrada:10}});
  all('movimentos').concat(all('vendas'),all('compras')).forEach(e=>{if(!e.exemplo){e.exemplo=true;touched.add((e.itens?'vendas':e.valorUnit!==undefined?'compras':'movimentos')+'|'+e.id)}});ver++;
}
function clearExample(){
  ['vendas','compras','movimentos'].forEach(c=>all(c).filter(e=>e.exemplo||String(e.produtoId||'').startsWith('ex')||(e.itens||[]).some(i=>String(i.produtoId).startsWith('ex'))).map(e=>e.id).forEach(id=>delEntry(c,id)));
  [...M.produtos.entries()].forEach(([id,d])=>{if(d.exemplo)delMaster('produtos',id)});[...M.centros.entries()].forEach(([id,d])=>{if(d.exemplo)delMaster('centros',id)});[...M.clientes.entries()].forEach(([id,d])=>{if(d.exemplo)delMaster('clientes',id)});
}

// ============ eventos ============
const ACT={
  go:id=>{view=id;try{history.replaceState(null,'','#'+id)}catch(e){}closeModal();render();window.scrollTo(0,0)},
  closeModal,entrada:(id,el)=>mMov('in',id,el&&el.dataset.q),saida:id=>mMov('out',id),novoProd:()=>mProduto(),editProd:id=>mProduto(id),prodInfo:id=>mProdInfo(id),invInfo:id=>mInvInfo(id),
  fst:k=>{F.estoque.st=k;render()},fcat:k=>{F.estoque.cat=k;render()},fclear:()=>{Object.assign(F.estoque,{q:'',cat:'',st:''});render()},eVis:k=>{F.estoque.vis=k;saveUI();render()},
  dPer:k=>{F.dash.per=k;saveUI();render()},dCat:k=>{F.dash.cat=F.dash.cat===k?'':k;render()},dClear:()=>{F.dash.cat='';F.dash.cc='';render()},dModo:k=>{F.dash.modo=k;render()},
  goStock:k=>{Object.assign(F.estoque,{q:'',st:k,cat:F.dash.cat||''});ACT.go('estoque')},
  goMov:k=>{Object.assign(F.mov,{per:F.dash.per==='365'?'tudo':F.dash.per==='90'?'tudo':F.dash.per,dir:k==='in'?'in':k==='out'?'out':'',tipo:k==='perda'?'__perda':'',prod:'',q:'',cc:F.dash.cc||''});ACT.go('mov')},
  mPer:k=>{F.mov.per=k;render()},
  aVer:k=>{F.alertas.ver=k;render()},aEs:k=>{F.alertas.es=k;if(k)F.alertas.ver='es';render()},aPg:k=>{F.alertas.pg=k==='avencer'?'avencer':k;F.alertas.ver=k||F.alertas.ver==='es'?'pg':F.alertas.ver;render()},pagar:k=>mPagar(k),
  novoCC:()=>mCentro(),editCC:id=>mCentro(id),ccPer:k=>{F.custos.ccPer=k;render()},
  ccMov:k=>{const per=F.custos.ccPer;Object.assign(F.mov,{per:per==='365'||per==='90'?'tudo':per==='mes'?'mes':'30',dir:'',tipo:'',prod:'',q:'',cc:k});ACT.go('mov')},
  fab:()=>openModal('O que você quer lançar?',`<div class="actions" style="grid-template-columns:1fr 1fr;margin:0">
    <button class="act" data-act="entrada"><span class="ic in">+</span><b>Entrada</b><span>Compra, devolução</span></button>
    <button class="act" data-act="saida"><span class="ic out">−</span><b>Saída</b><span>Venda, uso, perda</span></button>
    <button class="act" data-act="go" data-id="inventario"><span class="ic inv">✓</span><b>Contagem</b><span>Inventário</span></button>
    <button class="act" data-act="novoProd"><span class="ic new">＋</span><b>Produto</b><span>Cadastrar</span></button></div>`,true),fdir:k=>{F.mov.dir=k;render()},csort:k=>{F.custos.sort=k;render()},
  desfazer:id=>{const m=getEntry('movimentos',id);if(!m)return;const v=m.ref&&getEntry('vendas',m.ref);
    if(m.qtd>0&&stock(m.produtoId)<m.qtd)return toast('Não dá para desfazer: parte dessa entrada já saiu do estoque.');
    confirmBox('Desfazer lançamento',v?`A venda #${v.numero} inteira será desfeita e os produtos voltam ao estoque.`:`O sistema lança o contrário de <b>${m.qtd>0?'+':'−'}${num(Math.abs(m.qtd))} ${esc(pName(prod(m.produtoId)))}</b>. O registro original continua no histórico, marcado como desfeito.`,'Desfazer',async()=>{const msg=opDesfazer(m);await done(msg)},true)},
  invStart:()=>{INV={data:today(),c:{},f:{q:'',so:''}};saveINV();render()},
  invCancel:()=>confirmBox('Descartar contagem','Os números digitados serão perdidos. O estoque não muda.','Descartar',()=>{INV=null;saveINV();closeModal();render()},true),
  invSo:k=>{INV.f.so=k;saveINV();render()},
  invFinish:()=>{const ids=Object.keys(INV.c).filter(id=>prod(id));const dif=ids.filter(id=>INV.c[id]!==stock(id));const dV=sum(ids,id=>(INV.c[id]-stock(id))*(+prod(id).custo||0));
    confirmBox('Finalizar contagem',`${ids.length} produto${ids.length!==1?'s':''} contado${ids.length!==1?'s':''}, ${dif.length} com diferença (${dV>0?'+':''}${brl(dV)}). O estoque desses produtos passa a ser o que você contou.`,'Finalizar',async()=>{
      const id=uid(),t=today();const itens=ids.map(pid=>({produtoId:pid,sistema:stock(pid),contado:INV.c[pid],custo:+prod(pid).custo||0}));
      itens.forEach(i=>{const d=i.contado-i.sistema;if(d)addMov({data:t,produtoId:i.produtoId,tipo:'Inventário',qtd:d,motivo:'Contagem de '+fd(t)+(d<0?' (faltou)':' (sobrou)'),ref:id,custoUnit:i.custo})});
      putEntry('inventarios',{id,ts:Date.now(),data:t,itens,obs:''});INV=null;saveINV();await done('Contagem finalizada. Estoque ajustado.')})},
  saveCfg:async()=>{putMaster('config','geral',Object.assign({},M.config.get('geral')||{},{nome:val('c-nome')||'Minha Loja',minPadrao:Math.max(0,Math.round(nval('c-min'))),cobertura:Math.max(7,Math.round(nval('c-cob'))),margemMin:Math.max(0,nval('c-mg')),diasAviso:Math.max(0,Math.round(nval('c-dias')))}));await commit();render();toast('Ajustes salvos.')},
  backup:()=>{const data={app:'loja-limpeza',versao:2,geradoEm:new Date().toISOString()};[...COLS_B,...COLS_M].forEach(c=>data[c]=Object.fromEntries(COLS_B.includes(c)?B[c]:M[c]));
    const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='backup-estoque-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup baixado.')},
  loadEx:async()=>{if(all('produtos').length)return toast('O exemplo só pode ser carregado com o estoque vazio.');loadExample();await commit();render();toast('Exemplo carregado. Apague em Ajustes quando quiser.')},
  clearEx:()=>confirmBox('Apagar exemplo','Os produtos e lançamentos de exemplo serão apagados. O que você cadastrou continua.','Apagar',async()=>{clearExample();await done('Exemplo apagado.')},true),
  gsConnect:()=>gsConnect(),gsSync:()=>gsSync(false),
  gsUpload:()=>confirmBox('Reenviar tudo','Todos os dados deste aparelho serão gravados de novo na planilha, substituindo o que estiver lá. Use só se a planilha ficou diferente do app.','Reenviar',async()=>{touched.clear();gsQueue=fullOps();saveQueue();closeModal();await gsSend();render();toast(gsState.erro||'Dados reenviados.')},true),
  gsOff:()=>confirmBox('Desconectar','O app deixa de gravar na planilha. Os dados continuam na planilha e neste aparelho.','Desconectar',()=>{gs=null;gsQueue=[];saveGs();saveQueue();closeModal();render()},true),
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(e.target.closest('input,select,label')&&b.classList.contains('pc'))return;
  const f=ACT[b.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(b.dataset.id,b)}});
document.addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov'))closeModal()});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f){const [k,n]=t.dataset.f.split('.');if(k==='inv'){INV.f[n]=t.value;saveINV()}else F[k][n]=t.value;t.tagName==='SELECT'?render():schedule();return}
  if(t.dataset.count){const id=t.dataset.count,v=t.value.trim();if(v==='')delete INV.c[id];else INV.c[id]=Math.max(0,Math.round(+v||0));saveINV();
    const s=stock(id),has=INV.c[id]!==undefined,d=has?INV.c[id]-s:0,tr=t.closest('tr');if(tr)tr.className=has?(d?'diff':'okc'):'';
    const dd=document.getElementById('d-'+id);if(dd)dd.textContent=has?(d>0?'+':'')+num(d):'';const dv=document.getElementById('dv-'+id);if(dv)dv.textContent=has&&d?brl(d*(+prod(id).custo||0)):'';invBarUpdate()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.count){e.preventDefault();const ins=[...document.querySelectorAll('[data-count]')];const i=ins.indexOf(e.target);if(ins[i+1]){ins[i+1].focus();ins[i+1].select()}}});
document.addEventListener('change',e=>{if(e.target.id!=='restore'||!e.target.files[0])return;const file=e.target.files[0];e.target.value='';const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(x){return toast('Arquivo inválido.')}if(!d||d.app!=='loja-limpeza')return toast('Este arquivo não é um backup do sistema.');
    confirmBox('Restaurar backup','Os dados deste aparelho serão substituídos pelos do backup'+(gs?' e a planilha será atualizada':'')+'.','Restaurar',async()=>{[...COLS_B,...COLS_M].forEach(c=>{const t=COLS_B.includes(c)?B:M;t[c]=new Map(Object.entries(d[c]||{}))});ver++;touched.clear();if(gs){gsQueue=fullOps();saveQueue()}await done('Backup restaurado.')},true)};rd.readAsText(file)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==view){view=h;render()}});

loadLocal();render();if(gs)gsSync(true);
})();
